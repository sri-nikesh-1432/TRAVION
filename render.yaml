# Render Blueprint — TRAVION backend + PostgreSQL
#
# One-click deploy: commit this file, push to GitHub, then open:
#   https://render.com/deploy?repo=https://github.com/sri-nikesh-1432/TRAVION
# Render reads this file and provisions everything below. Alternatively create
# the services manually with the exact same settings.
#
# Auto-deploy: once connected, every push to the linked branch redeploys.

databases:
  - name: travion-db
    databaseName: travion
    user: travion
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: travion-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Wired automatically from the travion-db instance above.
      - key: DATABASE_URL
        fromDatabase:
          name: travion-db
          property: connectionString
      # Strong random secret generated by Render at creation time — never committed.
      - key: JWT_SIGNING_SECRET
        generateValue: true
      # Production CORS: only the deployed frontend origin.
      # (app/main.py also allows local dev origins in its code fallback.)
      - key: CORS_ALLOW_ORIGINS
        value: https://travions.netlify.app,https://travion18.netlify.app
      # Optional integrations — set real values in the Render dashboard.
      # sync: false = prompt for value at deploy time; secrets are never stored here.
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
