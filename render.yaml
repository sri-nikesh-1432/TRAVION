# Render Blueprint — TRAVION backend (MySQL production database)
#
# One-click deploy: commit this file, push to GitHub, then open:
#   https://render.com/deploy?repo=https://github.com/sri-nikesh-1432/TRAVION
# Render reads this file and provisions everything below. Alternatively create
# the services manually with the exact same settings.
#
# Auto-deploy: once connected, every push to the linked branch redeploys.
#
# ── Database hosting (MySQL 8) ───────────────────────────────────────────────
# Render's blueprint-managed database is PostgreSQL, but TRAVION's production
# engine is MySQL 8 (utf8mb4 / DECIMAL money — see database/README.md).
# Render does not provision MySQL, so create a MySQL 8 instance with any
# provider (Aiven, PlanetScale, Railway, AWS RDS, a Render Postgres is NOT a
# drop-in here) and wire it below. One-time setup on that instance:
#   1. CREATE DATABASE travion_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
#   2. load database/schema.sql (and optionally database/seed.sql) into it;
#   3. paste the connection string into DATABASE_URL in the Render dashboard
#      (the variable is declared sync:false below, i.e. never committed).
# If you instead keep the old PostgreSQL instance, the app still works — the
# backend speaks both dialects — but MySQL is the tested production target.

services:
  - type: web
    name: travion-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations are additive-safe: Base.metadata.create_all only creates
    # missing tables. For schema-versioned deploys replace the start command
    # with:  alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # MySQL connection string (mysql+pymysql://user:pass@host:3306/travion_db?charset=utf8mb4).
      # Set in the Render dashboard — never committed. See database/README.md.
      - key: DATABASE_URL
        sync: false
      # Strong random secret generated by Render at creation time — never committed.
      - key: JWT_SIGNING_SECRET
        generateValue: true
      # Production CORS: deployed frontend origins (both supported Netlify URLs).
      # app/main.py also allows local dev origins in its code fallback.
      - key: CORS_ALLOW_ORIGINS
        value: https://travions.netlify.app,https://travion18.netlify.app,https://travion-api.onrender.com
      # GeoApify — PRIMARY real-place discovery provider (server-side ONLY).
      # Set real value in Render dashboard.
      - key: GEOAPIFY_API_KEY
        sync: false
      # AI Reasoning
      - key: GEMINI_API_KEY
        sync: false
      # Weather (real replanning triggers)
      - key: OPENWEATHER_API_KEY
        sync: false
      # Razorpay TEST mode credentials
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Role elevation secrets (match seeds in auth.py)
      - key: MANAGER_ELEVATION_SECRET
        value: SIH-MANAGER
      - key: ADMIN_ELEVATION_SECRET
        value: SIH-ADMIN
      # Google Places API (secondary live tier, optional)
      - key: GOOGLE_PLACES_API_KEY
        sync: false
