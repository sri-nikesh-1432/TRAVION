# Alembic configuration — TRAVION (MySQL target database: travion_db)
#
# Usage (from backend/):
#   alembic current                 # which revision the database is on
#   alembic upgrade head            # apply all pending migrations
#   alembic revision --autogenerate -m "describe change"
#
# The database URL comes from the same environment as the FastAPI app
# (backend/.env → DATABASE_URL or DB_HOST/DB_* components). It is NEVER
# hardcoded here — see alembic/env.py.

[alembic]
script_location = alembic
prepend_sys_path = .
# Template used for migration file names
file_template = %%(rev)s_%%(slug)s
# Set to 'true' to run the environment during --autogenerate against the DB
# even when no changes are detected (still safe — emits an empty migration).
# truncate_slug_length = 40

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
